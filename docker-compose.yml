# Un único servicio: el proceso de Node con el servidor de Socket.IO.
#
# Aquí no hay reverse proxy ni terminación de TLS. De eso se encarga Cloudflare
# Tunnel, que abre la conexión *desde* la máquina hacia Cloudflare y devuelve
# dominio, HTTPS y certificado renovado solo, sin abrir ningún puerto de entrada
# en el VPS. Ver DESPLIEGUE.md.

services:
  ws:
    build: .
    image: disalud-ws
    restart: unless-stopped

    # Mismo fichero para dos cosas: las variables que recibe el contenedor y los
    # ${...} que docker compose interpola aquí abajo.
    env_file: .env
    environment:
      NODE_ENV: production

    # Se publica solo en la interfaz local (127.0.0.1): el único que necesita
    # llegar es cloudflared, que corre en esta misma máquina. Así el puerto no
    # queda accesible desde internet aunque el firewall del VPS esté abierto.
    # Si cloudflared vive en otro contenedor con su propia red, pon
    # HOST_BIND=0.0.0.0 en .env (ver la opción B de DESPLIEGUE.md).
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-8080}:${PORT:-8080}"

    # Margen para que el apagado ordenado cierre los sockets con calma.
    stop_grace_period: 30s

    # El healthcheck ya viene en la imagen (ver Dockerfile), así que
    # `docker compose ps` muestra healthy/unhealthy sin configurar nada más.

# Sin servicio de Redis: el servidor no guarda nada. Los avisos pendientes viven
# en el KV de disalud-org, que puede garantizarlos aunque esto esté caído.
# Cuando haga falta escalar a varias instancias, se añade aquí un `redis` y se
# define REDIS_URL: el adapter se activa solo (ver src/lib/redis.ts).
